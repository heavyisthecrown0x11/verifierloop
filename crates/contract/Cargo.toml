[package]
name = "contract"
version.workspace = true
edition.workspace = true

# The typed Rust<->Python JSON artifact-file contract. The envelope is generic
# over its payload (`Artifact<T>`), so it does not depend on the not-yet-finalized
# metric types in the `metrics` crate — a concrete metric type slots in as `T`
# once its fields are frozen.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
